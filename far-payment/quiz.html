<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#c06a1a">
<link rel="canonical" href="https://zonetai.com/value-isle/far-payment/quiz.html">
<script>(function(){if(/\.github\.io$/.test(location.hostname)){var m=document.createElement("meta");m.name="robots";m.content="noindex, follow";document.head.appendChild(m);}})();</script>
<title>09 判斷題與辭典｜容積代金學堂</title>
<meta name="description" content="容積代金判斷題：制度、法令、縣市、估價、範本、審議、標購七類，每題附依據；加上容積代金辭典。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=1">
</head>
<body>

<section class="page-hero">
  <div class="container">
    <span class="kicker">09 · Quiz</span>
    <h1>判斷題與辭典</h1>
    <p class="lede">答對一題之後，再試著說出依據是哪一市、哪一版的規定；課堂上這樣可以再加一分。題目來自課堂判斷題與期末考題型，每題附依據。答題紀錄留在你的瀏覽器裡。</p>
  </div>
</section>

<section class="section" style="padding-top:28px">
  <div class="container">
    <div class="cats" id="cats"></div>
    <div class="quiz">
      <div class="card q-card" id="quizCard"></div>
      <div>
        <div class="section-head" style="margin-bottom:14px"><div><h2 style="font-size:1.3rem">容積代金辭典</h2><p style="font-size:.88rem">常被問到的名詞。</p></div></div>
        <div class="glossary" id="glossary"></div>
      </div>
    </div>
  </div>
</section>

<script src="assets/data.js?v=1"></script>
<script src="assets/common.js?v=1"></script>
<script>
(function(){
  const D = window.FP, U = window.FPU, $ = U.$, $$ = U.$$;
  const ALL = D.quiz, cats = ["全部", ...new Set(ALL.map(q => q.cat))];
  let cat = "全部", qi = 0, answered = false;
  let record = {}; try { record = JSON.parse(localStorage.getItem("fp-quiz") || "{}"); } catch (e) {}
  const saveR = () => { try { localStorage.setItem("fp-quiz", JSON.stringify(record)); } catch (e) {} U.mark("quiz", Object.values(record).filter(v => v === true).length); };
  const key = q => q.q, pool = () => ALL.filter(q => cat === "全部" || q.cat === cat);
  function renderCats() { $("#cats").innerHTML = cats.map(c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${c}">${c}<small style="margin-left:4px;color:var(--ink-3)">${c === "全部" ? ALL.length : ALL.filter(q => q.cat === c).length}</small></button>`).join(""); $$("#cats .chip").forEach(b => b.onclick = () => { cat = b.dataset.c; qi = 0; renderCats(); render(); }); }
  function render() {
    const P = pool(), q = P[qi], c = $("#quizCard");
    const score = P.filter(x => record[key(x)] === true).length, tried = P.filter(x => record[key(x)] !== undefined).length;
    c.innerHTML = `<span class="qn">${q.cat} · Q ${qi + 1} / ${P.length}</span><h3>${q.q}</h3><div class="q-opts">${q.opts.map((o, i) => `<button data-i="${i}">${["A", "B", "C", "D"][i]}　${o}</button>`).join("")}</div><div class="q-exp" id="qExp">${q.exp}<cite>依據：${q.src}</cite></div>
      <div class="q-foot"><div><span class="score">答對 ${score} / 已答 ${tried}</span><div class="score-ring">${P.map(x => `<i class="${record[key(x)] === true ? "ok" : record[key(x)] === false ? "no" : ""}"></i>`).join("")}</div></div><div style="display:flex;gap:6px"><button class="btn ghost sm" id="qPrev" ${qi === 0 ? "disabled" : ""}>←</button><button class="btn ghost sm" id="qNext">${qi === P.length - 1 ? "重新開始" : "下一題 →"}</button></div></div>`;
    answered = record[key(q)] !== undefined;
    if (answered) { $$(".q-opts button")[q.a].classList.add("right"); $("#qExp").classList.add("show"); }
    $$(".q-opts button").forEach(b => b.onclick = () => { if (answered) return; answered = true; const i = +b.dataset.i; if (i === q.a) { b.classList.add("right"); record[key(q)] = true; U.toast("答對了！說得出依據是哪一市、哪一版嗎？"); } else { b.classList.add("wrong"); $$(".q-opts button")[q.a].classList.add("right"); record[key(q)] = false; } saveR(); $("#qExp").classList.add("show"); $(".score").textContent = `答對 ${P.filter(x => record[key(x)] === true).length} / 已答 ${P.filter(x => record[key(x)] !== undefined).length}`; $$(".score-ring i")[qi].className = record[key(q)] ? "ok" : "no"; });
    $("#qNext").onclick = () => { if (qi === P.length - 1) { qi = 0; P.forEach(x => delete record[key(x)]); saveR(); } else qi++; render(); };
    $("#qPrev").onclick = () => { if (qi > 0) { qi--; render(); } };
  }
  renderCats(); render();
  $("#glossary").innerHTML = D.glossary.map(g => `<details><summary>${g.t}</summary><p>${g.d}</p></details>`).join("");
})();
</script>
</body>
</html>
