<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國際洋流｜價值島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body>

<section class="page-hero">
  <div class="container">
    <span class="kicker">Global Currents</span>
    <h1>國際洋流</h1>
    <p>國際局勢不會直接出現在估價報告裡，但會透過「資金成本」與「預期」一路流到價格。下面的洋流圖畫出每一股力量怎麼流向臺灣，卡片則畫出它的傳導路徑。</p>
    <div class="layer-badge" style="--c:var(--c-intl)"><i></i>LAYER 02 · 一般因素</div>
  </div>
</section>

<section class="section" style="padding-top:28px">
  <div class="container">
    <div class="layer-daily" id="layerDaily"></div>

    <div class="section-head" style="margin-top:8px"><div><h2>洋流怎麼流到臺灣</h2><p>點圖上的來源，會帶到對應的傳導路徑。</p></div></div>
    <div class="currents-map reveal">
      <svg viewBox="0 0 1000 420" id="map"></svg>
    </div>
    <div class="intl-grid" id="intlGrid"></div>

    <div class="section-head reveal" style="margin-top:56px"><div><h2>這一層的觀測項目</h2><p>估價師在「國際洋流」這一層會看的指標。</p></div></div>
    <div class="intl-grid" id="items"></div>
  </div>
</section>

<script src="assets/data.js?v=5"></script>
<script src="assets/common.js?v=5"></script>
<script>
(function(){
  const D = window.DATA, VI = window.VI, $ = VI.$, $$ = VI.$$;
  /* 洋流圖：五個來源流向臺灣 */
  const nodes = [
    { id:0, x:120, y:120, t:"美國", s:"FED · TARIFF", c:"#2a6f97" },
    { id:1, x:160, y:300, t:"外匯市場", s:"TWD / USD", c:"#2b8a6e" },
    { id:2, x:520, y:60, t:"全球科技業", s:"AI · SEMICONDUCTOR", c:"#7b4fa3" },
    { id:3, x:880, y:120, t:"東亞供應鏈", s:"SUPPLY CHAIN", c:"#c9711a" },
    { id:4, x:860, y:320, t:"區域安全", s:"GEOPOLITICS", c:"#b5452e" },
    { id:5, x:300, y:60, t:"全球通膨", s:"MATERIALS · WAGES", c:"#8a5a2b" }
  ];
  const TW = { x:520, y:250 };
  let s = `<defs><radialGradient id="g" cx="50%" cy="50%"><stop offset="0" stop-color="#8fd1e6" stop-opacity=".6"/><stop offset="1" stop-color="#8fd1e6" stop-opacity="0"/></radialGradient></defs>
    <rect width="1000" height="420" fill="#eaf6fb" rx="12"/>`;
  for (let i = 0; i < 9; i++) s += `<path d="M-20 ${40+i*45} Q 100 ${30+i*45} 220 ${40+i*45} T 460 ${40+i*45} T 700 ${40+i*45} T 940 ${40+i*45} T 1180 ${40+i*45}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1"/>`;
  s += `<circle cx="${TW.x}" cy="${TW.y}" r="90" fill="url(#g)"/>`;
  nodes.forEach(n => {
    const cx = (n.x + TW.x) / 2 + (n.y < TW.y ? 40 : -40), cy = (n.y + TW.y) / 2 + (n.x < TW.x ? 60 : -60);
    s += `<path class="lane" data-i="${n.id}" d="M${n.x} ${n.y} Q ${cx} ${cy} ${TW.x} ${TW.y}" stroke="${n.c}" style="animation-delay:${-n.id*0.4}s"/>`;
  });
  nodes.forEach(n => { s += `<g class="src" data-i="${n.id}" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="26" fill="#fff" stroke="${n.c}" stroke-width="2"/><text class="node" x="${n.x}" y="${n.y+4}" text-anchor="middle">${n.t}</text><text class="node-sub" x="${n.x}" y="${n.y+42}" text-anchor="middle">${n.s}</text></g>`; });
  s += `<g class="tw"><polygon points="${TW.x-18},${TW.y-34} ${TW.x+14},${TW.y-30} ${TW.x+22},${TW.y+6} ${TW.x+4},${TW.y+36} ${TW.x-16},${TW.y+20} ${TW.x-24},${TW.y-10}" fill="#7fbf63" stroke="#5f9d4c" stroke-width="2"/><text class="node" x="${TW.x}" y="${TW.y+58}" text-anchor="middle">臺灣不動產</text><text class="node-sub" x="${TW.x}" y="${TW.y+72}" text-anchor="middle">資金成本 → 預期 → 價格</text></g>`;
  $("#map").innerHTML = s;

  const cards = D.intl;
  $("#intlGrid").innerHTML = cards.map((c,i) => `<div class="card intl-card reveal" data-i="${i}"><div class="ico">${c.ico}</div><span class="from">FROM ${c.from}</span><h3>${c.t}</h3><p>${c.s}</p><div class="path">${c.path.map(p => `<span>${p}</span>`).join("")}</div></div>`).join("");
  // 點地圖上的來源，對應卡片亮起並捲到
  const nodeToCard = { 0:0, 1:1, 2:3, 3:2, 4:4, 5:5 };
  $$("#map .src").forEach(g => g.onclick = () => { const ci = nodeToCard[g.dataset.i]; $$(".intl-card").forEach(c => c.classList.remove("lit")); const card = $(`.intl-card[data-i="${ci}"]`); card.classList.add("lit"); card.scrollIntoView({ block:"center", behavior:"smooth" }); $$("#map .lane").forEach(l => l.style.opacity = l.dataset.i == g.dataset.i ? 1 : .2); setTimeout(() => $$("#map .lane").forEach(l => l.style.opacity = ""), 2500); });

  const L = D.layers.find(l => l.id === "intl");
  $("#items").innerHTML = L.items.map(i => `<div class="card intl-card reveal"><span class="from">GLOBAL CURRENTS</span><h3>${i.t}</h3><p>${i.s}</p><div class="path"><span>${i.i}</span></div></div>`).join("");
  VI.layerDaily("intl", "#layerDaily", { title: "國際洋流的最新動態" });
  VI.reveal();
})();
</script>
</body>
</html>
