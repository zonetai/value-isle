<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#e4572e">
<link rel="canonical" href="https://zonetai.com/value-isle/notes.html">
<meta property="og:url" content="https://zonetai.com/value-isle/notes.html">
<script>/* 同一份內容只讓搜尋引擎收錄官網 zonetai.com/value-isle；GitHub Pages 的副本標為不收錄 */(function(){if(/\.github\.io$/.test(location.hostname)){var m=document.createElement("meta");m.name="robots";m.content="noindex, follow";document.head.appendChild(m);}})();</script>
<title>估價師手記｜價值島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=13">
</head>
<body>

<section class="page-hero">
  <div class="container">
    <span class="kicker">Appraiser's Notes</span>
    <h1>估價師手記</h1>
    <p>估價師歷年寫過的專欄、投書、期刊文章與專訪摘要，由新到舊排列。每一篇都從一件經手的案子或一則新聞起手，用估價的方法拆開來看。點卡片展開三個重點；想看全文請洽原刊物。較早的文章談到的制度，部分已經修法，卡片上會註明。</p>
  </div>
</section>

<section class="section" style="padding-top:28px">
  <div class="container">
    <div class="note-filters" id="yearBar"></div>
    <div class="note-filters reveal" id="filters"></div>
    <div class="notes-grid" id="notes"></div>
  </div>
</section>

<script src="assets/data.js?v=13"></script>
<script src="assets/knowledge.js?v=13"></script>
<script src="assets/icons.js?v=13"></script>
<script src="assets/common.js?v=13"></script>
<script>
(function(){
  const D = window.DATA, K = window.KN, VI = window.VI, $ = VI.$, $$ = VI.$$;
  const layerOf = id => D.layers.find(l => l.id === id);
  let cat = "全部", yr = "全部";
  function render(){
    const cats = ["全部", ...D.layers.map(l => l.id)];
    $("#filters").innerHTML = cats.map(c => `<button class="chip ${c===cat?"on":""}" data-c="${c}">${c==="全部"?"全部":`<span class="dot" style="color:${layerOf(c).hex}"></span>${layerOf(c).name}`}</button>`).join("");
    $$("#filters .chip").forEach(b => b.onclick = () => { cat = b.dataset.c; render(); });
    const years = [...new Set(K.articles.map(a => a.date.slice(0, 4)))].sort().reverse();
    $("#yearBar").innerHTML = ["全部", ...years].map(y => `<button class="chip ${y===yr?"on":""}" data-y="${y}">${y==="全部"?"全部年份":y+" 年"}<small>${y==="全部"?K.articles.length:K.articles.filter(a=>a.date.startsWith(y)).length}</small></button>`).join("");
    $$("#yearBar .chip").forEach(b => b.onclick = () => { yr = b.dataset.y; render(); });
    const list = K.articles.filter(a => (cat === "全部" || a.layer === cat) && (yr === "全部" || a.date.startsWith(yr))).sort((x, y) => y.date.localeCompare(x.date));
    let lastY = "";
    $("#notes").innerHTML = list.map((a,i) => { const y = a.date.slice(0, 4), head = y !== lastY ? `<div class="year-head"><b>${y}</b><span>${list.filter(x => x.date.startsWith(y)).length} 篇</span></div>` : ""; lastY = y; return head + `<div class="card note-card reveal in" style="--c:${layerOf(a.layer).hex};animation:popin .4s ease ${Math.min(i, 8)*60}ms both" data-id="${a.id}">
      <div class="meta"><span class="tag ${layerOf(a.layer).cls}">${layerOf(a.layer).name}</span><span>${a.date}</span><span>${a.venue}</span></div>
      <h3>${a.title}</h3>
      <div class="quote">${a.quote}</div>
      <p>${a.summary}</p>
      <div class="takes">${a.takeaways.map(t => `<span>${t}</span>`).join("")}</div>
      <div class="aud">適合：${a.audience}　<span style="color:var(--c)">點卡片展開重點 ›</span></div></div>`; }).join("") || `<div class="card">這個條件下沒有文章。</div>`;
    $$(".note-card").forEach(c => c.onclick = () => c.classList.toggle("open"));
  }
  render();
  VI.reveal();
})();
</script>
</body>
</html>
