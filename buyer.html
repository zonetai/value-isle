<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買方看價路線｜價值島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body>

<section class="page-hero">
  <div class="container">
    <span class="kicker">Buyer's Route</span>
    <h1>買方看價路線</h1>
    <p>買房前，估價師會怎麼替你看價？這一頁把諮詢經驗整理成一條可以打勾的路線：八個步驟、五個開價判讀、六個急售訊號、找比較案例的五個原則，以及仲介常見話術的回法。進度會留在你的瀏覽器裡。</p>
    <div class="layer-badge" style="--c:var(--c-market)"><i></i>來自買房議價諮詢經驗</div>
  </div>
</section>

<section class="section" style="padding-top:28px">
  <div class="container">
    <div class="two-col">
      <div class="reveal">
        <div class="section-head" style="margin-bottom:10px"><div><h2 style="font-size:1.4rem">八步看價路線</h2><p>做完一步打一個勾。</p></div><span class="mono" id="progText">0 / 8</span></div>
        <div class="progress"><i id="prog"></i></div>
        <div class="checklist" id="steps"></div>
      </div>
      <div class="reveal">
        <div class="section-head" style="margin-bottom:18px"><div><h2 style="font-size:1.4rem">開價合不合理的五個判讀</h2></div></div>
        <div class="num-list" id="checks" style="--c:var(--c-market)"></div>
        <div class="section-head" style="margin:28px 0 14px"><div><h2 style="font-size:1.4rem">用實價登錄找比較案例的五個原則</h2></div></div>
        <div class="bullets" id="comps"></div>
      </div>
    </div>

    <div class="section-head reveal" style="margin-top:64px"><div><h2>屋主動機與急售訊號</h2><p>一般買方就觀察得到的六個訊號。</p></div></div>
    <div class="bullets reveal" id="signals"></div>

    <div class="section-head reveal" style="margin-top:64px"><div><h2>仲介常用話術，怎麼回</h2><p>點卡片翻面。</p></div></div>
    <div class="flipcards reveal" id="scripts"></div>
    <p class="disclaimer reveal">折扣比例、修繕費區間、上架天數門檻皆為通用經驗值，依地區與市況調整，不是保證數字。</p>
  </div>
</section>

<script src="assets/data.js?v=5"></script>
<script src="assets/knowledge.js?v=5"></script>
<script src="assets/common.js?v=5"></script>
<script>
(function(){
  const K = window.KN.buyer, VI = window.VI, $ = VI.$, $$ = VI.$$;
  const done = new Set(JSON.parse(localStorage.getItem("vi-buyer") || "[]"));
  function renderSteps(){
    $("#steps").innerHTML = K.steps.map((s,i) => `<label class="${done.has(i)?"done":""}"><input type="checkbox" data-i="${i}" ${done.has(i)?"checked":""}><span><b>${s.t}</b><small>${s.why}</small></span></label>`).join("");
    $$("#steps input").forEach(c => c.onchange = () => { c.checked ? done.add(+c.dataset.i) : done.delete(+c.dataset.i); localStorage.setItem("vi-buyer", JSON.stringify([...done])); renderSteps(); if (done.size === K.steps.length) VI.toast("八步走完了。現在你手上有行情、謄本、修繕費和三個數字。", 3200); });
    $("#progText").textContent = `${done.size} / ${K.steps.length}`;
    requestAnimationFrame(() => $("#prog").style.width = (done.size / K.steps.length * 100) + "%");
  }
  renderSteps();
  $("#checks").innerHTML = K.checks.map(c => `<div class="card"><b>${c.t}</b><p>${c.s}</p></div>`).join("");
  $("#comps").innerHTML = K.comps.map(c => `<div>${c}</div>`).join("");
  $("#signals").innerHTML = K.signals.map(c => `<div>${c}</div>`).join("");
  $("#scripts").innerHTML = K.scripts.map(s => `<div class="flip"><div class="inner"><div class="face front">「${s.say}」<span class="hint">點我翻面</span></div><div class="face back">${s.reply}</div></div></div>`).join("");
  $$(".flip").forEach(f => f.onclick = () => f.classList.toggle("on"));
  VI.reveal();
})();
</script>
</body>
</html>
