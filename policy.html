<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#e4572e">
<link rel="canonical" href="https://zonetai.com/value-isle/policy.html">
<meta property="og:url" content="https://zonetai.com/value-isle/policy.html">
<script>/* 同一份內容只讓搜尋引擎收錄官網 zonetai.com/value-isle；GitHub Pages 的副本標為不收錄 */(function(){if(/\.github\.io$/.test(location.hostname)){var m=document.createElement("meta");m.name="robots";m.content="noindex, follow";document.head.appendChild(m);}})();</script>
<title>政策時間軸｜價值島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=9">
</head>
<body>

<section class="page-hero">
  <div class="container">
    <span class="kicker">Policy Climate</span>
    <h1>政策時間軸</h1>
    <p>把近年影響不動產價格的政策一字排開，2025 年起的事件來自估價師每月追蹤的一般因素分析。按「播放」讓事件依時間一個個亮起，每一條都附「對估價的影響」。不評論政策好壞，只說它怎麼改變價格形成的方式。</p>
    <div class="layer-badge" style="--c:var(--c-policy)"><i></i>LAYER 01 · 一般因素</div>
  </div>
</section>

<section class="section" style="padding-top:28px">
  <div class="container">
    <div class="layer-daily" id="layerDaily"></div>

    <div class="section-head" style="margin-top:8px"><div><h2>政策時間軸</h2><p>最新的在最上面，往下回溯到 2020 年的信用管制。標「近期動態」的事件來自每日觀測，附原文連結；按播放會從最早的事件一路亮到最新。</p></div></div>
    <div class="tl-player reveal">
      <button class="btn sm" id="tlPlay">▶ 播放</button>
      <button class="btn ghost sm" id="tlReset">⏮ 全部顯示</button>
      <div style="flex:1;min-width:220px"><div class="track"><i id="tlFill"></i><div class="knob" id="tlKnob" style="left:0"></div></div><div class="years" id="tlYears"></div></div>
      <div class="now" id="tlNow">全部</div>
    </div>
    <div class="tl-filters" id="tlFilters"></div>
    <div class="timeline" id="timeline"></div>

    <div class="section-head reveal" style="margin-top:56px"><div><h2>這一層的觀測項目</h2><p>除了時間軸上的事件，估價師在「政策氣候」這一層還持續盯著這些。</p></div></div>
    <div class="intl-grid" id="items"></div>
  </div>
</section>

<script src="assets/data.js?v=9"></script>
<script src="assets/common.js?v=9"></script>
<script>
(function(){
  const D = window.DATA, VI = window.VI, $ = VI.$, $$ = VI.$$;
  const catColor = { "信用管制":"var(--c-policy)", "稅制":"#b5452e", "交易限制":"#8a5a2b", "住宅政策":"var(--c-market)", "資訊透明":"var(--c-intl)", "利率":"var(--c-intl)", "國際":"#2a6f97", "都更危老":"var(--c-ind)", "其他":"var(--ink-3)", "近期動態":"var(--accent)", "追蹤中":"var(--ink-3)" };
  let P = D.policies;
  const years = [...new Set(P.map(p => p.when.slice(0,4)))];
  $("#tlYears").innerHTML = years.map(y => `<span>${y}</span>`).join("");
  let tlCat = "全部";
  function render(){
    const cats = ["全部", ...new Set(P.map(p => p.cat))];
    $("#tlFilters").innerHTML = cats.map(c => `<button class="chip ${c===tlCat?"on":""}" data-cat="${c}">${c!=="全部"?`<span class="dot" style="color:${catColor[c]||'var(--ink)'}"></span>`:""}${c}</button>`).join("");
    $$("#tlFilters .chip").forEach(b => b.onclick = () => { tlCat = b.dataset.cat; stop(); render(); });
    $("#timeline").innerHTML = [...P].reverse().map((p,i) => `<div class="tl-item reveal ${p.future?"future":""} ${tlCat!=="全部"&&p.cat!==tlCat?"hide":""}" data-i="${i}" style="--c:${catColor[p.cat]||'var(--ink)'}">
      <div class="when">${p.when}</div>
      <div class="card"><span class="tag" style="background:${catColor[p.cat]||'var(--ink)'};color:#fff">${p.cat}</span> <b>${p.t}</b><p>${p.s}</p><div class="impact">${p.i}</div>${p.url?`<div class="src"><a href="${p.url}" target="_blank" rel="noopener">${p.src} ↗</a></div>`:""}</div></div>`).join("");
    VI.reveal();
  }
  /* 播放器：依序點亮 */
  let timer = null, idx = -1;
  function stop(){ clearInterval(timer); timer = null; $("#tlPlay").textContent = "▶ 播放"; }
  function showAll(){ stop(); idx = -1; $$(".tl-item").forEach(e => e.classList.remove("dim","lit")); $("#tlFill").style.width = "0"; $("#tlKnob").style.left = "0"; $("#tlNow").textContent = "全部"; }
  function step(){
    const items = $$(".tl-item:not(.hide)").reverse();   /* 畫面上最新在上，播放仍由最早播到最新 */
    idx++;
    if (idx >= items.length) { stop(); return; }
    items.forEach((e,i) => { e.classList.toggle("dim", i > idx); e.classList.toggle("lit", i === idx); });
    const pct = (idx + 1) / items.length * 100;
    $("#tlFill").style.width = pct + "%"; $("#tlKnob").style.left = pct + "%";
    $("#tlNow").textContent = items[idx].querySelector(".when").textContent;
    items[idx].scrollIntoView({ block: "center", behavior: "smooth" });
  }
  $("#tlPlay").onclick = () => {
    if (timer) { stop(); return; }
    if (idx < 0 || idx >= $$(".tl-item:not(.hide)").length - 1) { idx = -1; $$(".tl-item").forEach(e => e.classList.add("dim")); }
    $("#tlPlay").textContent = "❚❚ 暫停"; step(); timer = setInterval(step, 1800);
  };
  $("#tlReset").onclick = showAll;
  render();
  /* 把每日觀測裡屬於政策層的動態接在時間軸後面 */
  VI.loadDaily(DAILY => {
    if (!DAILY) return;
    const recent = DAILY.briefs.filter(b => b.layer === "policy").slice(0, 12).reverse().map(b => ({ when: b.d, cat: "近期動態", t: b.t, s: b.s, i: b.i || "", src: b.src, url: b.url }));
    if (!recent.length) return;
    P = [...D.policies.filter(p => !p.future), ...recent, ...D.policies.filter(p => p.future)];
    render();
  });
  VI.layerDaily("policy", "#layerDaily", { title: "政策氣候的最新動態" });

  const L = D.layers.find(l => l.id === "policy");
  $("#items").innerHTML = L.items.map(i => `<div class="card intl-card reveal"><span class="from">POLICY CLIMATE</span><h3>${i.t}</h3><p>${i.s}</p><div class="path"><span>${i.i}</span></div></div>`).join("");
  VI.reveal();
})();
</script>
</body>
</html>
