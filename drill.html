<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#e4572e">
<link rel="canonical" href="https://zonetai.com/value-isle/drill.html">
<meta property="og:url" content="https://zonetai.com/value-isle/drill.html">
<script>/* 同一份內容只讓搜尋引擎收錄官網 zonetai.com/value-isle；GitHub Pages 的副本標為不收錄 */(function(){if(/\.github\.io$/.test(location.hostname)){var m=document.createElement("meta");m.name="robots";m.content="noindex, follow";document.head.appendChild(m);}})();</script>
<title>估價小測 ＋ 估價師辭典｜價值島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=10">
</head>
<body>

<section class="page-hero">
  <div class="container">
    <span class="kicker">Appraiser's Quiz</span>
    <h1>估價小測 ＋ 估價師辭典</h1>
    <p>題目來自估價師的審查、都更審議與買房諮詢經驗。選一個主題練直覺，旁邊是常被問到的名詞。答題紀錄會留在你的瀏覽器裡。</p>
  </div>
</section>

<section class="section" style="padding-top:28px">
  <div class="container">
    <div class="note-filters" id="cats"></div>
    <div class="quiz">
      <div class="card q-card" id="quizCard"></div>
      <div>
        <div class="section-head" style="margin-bottom:14px"><div><h2 style="font-size:1.3rem">估價師辭典</h2></div></div>
        <div class="glossary" id="glossary"></div>
      </div>
    </div>
  </div>
</section>

<script src="assets/data.js?v=10"></script>
<script src="assets/knowledge.js?v=10"></script>
<script src="assets/common.js?v=10"></script>
<script>
(function(){
  const D = window.DATA, K = window.KN, VI = window.VI, $ = VI.$, $$ = VI.$$;
  const ALL = D.quiz.map(q => ({ ...q, cat:"估價基礎" })).concat(K.quiz);
  const cats = ["全部", ...new Set(ALL.map(q => q.cat))];
  let cat = "全部", qi = 0, answered = false;
  const record = JSON.parse(localStorage.getItem("vi-quiz2") || "{}");
  const key = q => q.q;
  function pool(){ return ALL.filter(q => cat === "全部" || q.cat === cat); }
  function renderCats(){ $("#cats").innerHTML = cats.map(c => `<button class="chip ${c===cat?"on":""}" data-c="${c}">${c}<small style="margin-left:4px;color:var(--ink-3)">${c==="全部"?ALL.length:ALL.filter(q=>q.cat===c).length}</small></button>`).join(""); $$("#cats .chip").forEach(b => b.onclick = () => { cat = b.dataset.c; qi = 0; renderCats(); render(); }); }
  function render(){
    const P = pool(), q = P[qi], c = $("#quizCard");
    const score = P.filter(x => record[key(x)] === true).length, tried = P.filter(x => record[key(x)] !== undefined).length;
    c.innerHTML = `<div class="q-inner"><span class="qn">${q.cat} · Q ${qi+1} / ${P.length}</span><h3>${q.q}</h3><div class="q-opts">${q.opts.map((o,i) => `<button data-i="${i}">${o}</button>`).join("")}</div><div class="q-exp" id="qExp">${q.exp}</div>
      <div class="q-foot"><div><span class="score">答對 ${score} / 已答 ${tried}</span><div class="score-ring">${P.map(x => `<i class="${record[key(x)]===true?"ok":record[key(x)]===false?"no":""}"></i>`).join("")}</div></div><div style="display:flex;gap:6px"><button class="btn ghost sm" id="qPrev" ${qi===0?"disabled":""}>←</button><button class="btn ghost sm" id="qNext">${qi===P.length-1?"重新開始":"下一題 →"}</button></div></div></div>`;
    answered = record[key(q)] !== undefined;
    if (answered) { $$(".q-opts button")[q.a].classList.add("right"); $("#qExp").classList.add("show"); }
    $$(".q-opts button").forEach(b => b.onclick = () => { if (answered) return; answered = true; const i = +b.dataset.i; if (i === q.a) { b.classList.add("right"); record[key(q)] = true; VI.toast("答對了！"); } else { b.classList.add("wrong"); $$(".q-opts button")[q.a].classList.add("right"); record[key(q)] = false; } localStorage.setItem("vi-quiz2", JSON.stringify(record)); $("#qExp").classList.add("show"); $(".score").textContent = `答對 ${P.filter(x => record[key(x)] === true).length} / 已答 ${P.filter(x => record[key(x)] !== undefined).length}`; $$(".score-ring i")[qi].className = record[key(q)] ? "ok" : "no"; });
    $("#qNext").onclick = () => { if (qi === P.length - 1) { qi = 0; P.forEach(x => delete record[key(x)]); localStorage.setItem("vi-quiz2", JSON.stringify(record)); } else qi++; render(); };
    $("#qPrev").onclick = () => { if (qi > 0) { qi--; render(); } };
  }
  renderCats(); render();
  $("#glossary").innerHTML = D.glossary.map(g => `<details><summary>${g.t}</summary><p>${g.d}</p></details>`).join("");
})();
</script>
</body>
</html>
