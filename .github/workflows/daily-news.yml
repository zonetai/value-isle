# 價值島每日觀測：每天早上由 Claude 搜新聞、更新 data/daily.ts，檢查通過才推上 main；Vercel 收到推送就自動部署。
# 任務內容寫在 .github/daily-news-prompt.md（要改寫法改那份）。
#
# 需要的設定（GitHub repo → Settings → Secrets and variables → Actions）：
#   Secret   ANTHROPIC_API_KEY   公司的 Anthropic API key（Console 需開啟 web search）
#   Variable DAILY_MODEL         選填，預設 claude-sonnet-5-5
#   Variable DAILY_GIT_NAME / DAILY_GIT_EMAIL  選填，提交者身分；Vercel 若擋機器人提交，改成團隊成員的 GitHub 身分
name: 每日觀測

on:
  schedule:
    - cron: "20 23 * * *" # 臺北時間每天 07:20（GitHub 排程可能延遲數十分鐘）
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 今天的日期（臺北）
        id: today
        run: echo "date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"

      - name: Claude 整理每日觀測
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            今天是 ${{ steps.today.outputs.date }}（臺北時間）。
            請先用 Read 讀 .github/daily-news-prompt.md，完全照裡面的步驟與規則更新 data/daily.ts。
            只改 data/daily.ts；不要執行 git，提交與推送由排程負責。
          claude_args: |
            --model ${{ vars.DAILY_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 60
            --allowedTools "WebSearch,WebFetch,Read,Edit,Glob,Grep,Bash(npm run check:daily),Bash(npm run -s check:daily)"

      - name: 推送前把關：只准改 data/daily.ts，型別與資料檢查都要過
        run: |
          changed="$(git status --porcelain)"
          echo "$changed"
          if [ -z "$changed" ]; then echo "今天沒有變更"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          if echo "$changed" | grep -v ' data/daily.ts$' | grep -q .; then echo "::error::除了 data/daily.ts 還改了別的檔案，不推送"; exit 1; fi
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run check:daily

      - name: 提交並推送
        if: env.SKIP != '1'
        run: |
          git config user.name "${{ vars.DAILY_GIT_NAME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.DAILY_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}"
          git add data/daily.ts
          git commit -m "每日觀測 ${{ steps.today.outputs.date }}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          echo "::error::推送失敗"; exit 1
