<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個別條件調整儀｜價值島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<section class="page-hero">
  <div class="container">
    <span class="kicker">Individual Factors</span>
    <h1>個別條件調整儀</h1>
    <p>估價師做比較法時，會把比較標的的價格依「個別條件」逐項調整。這裡讓你親手拉一次：選一個行政區當基準，再設定這塊地的條件，右邊的房子和價格會跟著變。</p>
    <div class="layer-badge" style="--c:var(--c-ind)"><i></i>LAYER 04 · 個別因素</div>
  </div>
</section>

<section class="section" style="padding-top:28px">
  <div class="container">
    <div class="sim">
      <div class="sim-controls" id="simControls">
        <div class="ctrl"><label>基準行政區<small>以該區近一年住宅大樓平均單價為起點</small></label><select id="simDistrict"></select></div>
      </div>
      <div class="card sim-out">
        <div class="house-vis">
          <svg viewBox="0 0 520 260" id="house">
            <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
            <rect width="520" height="260" fill="url(#sky)"/>
            <g class="sun" id="sun"><circle cx="60" cy="40" r="16" fill="#f2c14e"/><g stroke="#f2c14e" stroke-width="3" stroke-linecap="round"><line x1="60" y1="14" x2="60" y2="6"/><line x1="60" y1="66" x2="60" y2="74"/><line x1="34" y1="40" x2="26" y2="40"/><line x1="86" y1="40" x2="94" y2="40"/><line x1="42" y1="22" x2="36" y2="16"/><line x1="78" y1="58" x2="84" y2="64"/><line x1="78" y1="22" x2="84" y2="16"/><line x1="42" y1="58" x2="36" y2="64"/></g></g>
            <!-- 電塔 -->
            <g id="pylon" style="transition:opacity .4s"><path d="M430 210 L445 110 L460 210 M438 160 L452 160 M434 185 L456 185 M436 135 L454 135" fill="none" stroke="#6e6e6e" stroke-width="3"/><path d="M400 118 Q445 130 490 118" fill="none" stroke="#6e6e6e" stroke-width="1.5"/></g>
            <!-- 地面 / 道路 -->
            <rect x="0" y="210" width="520" height="50" fill="#9bcf7e"/>
            <rect id="road" x="0" y="222" width="520" height="22" fill="#6b6b6b"/>
            <line id="roadline" x1="0" y1="233" x2="520" y2="233" stroke="#fff" stroke-width="2" stroke-dasharray="14 12"/>
            <!-- 捷運列車 -->
            <g id="train" class="train"><rect x="0" y="246" width="70" height="12" rx="3" fill="#2a6f97"/><rect x="6" y="249" width="14" height="6" fill="#dff4fb"/><rect x="28" y="249" width="14" height="6" fill="#dff4fb"/><rect x="50" y="249" width="14" height="6" fill="#dff4fb"/></g>
            <g id="mrt"><rect x="300" y="186" width="36" height="24" rx="3" fill="#2a6f97"/><text x="318" y="202" text-anchor="middle" font-size="10" fill="#fff" font-family="IBM Plex Mono">MRT</text></g>
            <!-- 樹 -->
            <g><rect x="78" y="190" width="6" height="22" fill="#7a5a3a"/><circle cx="81" cy="184" r="16" fill="#3f8f3a"/></g>
            <g><rect x="118" y="196" width="5" height="16" fill="#7a5a3a"/><circle cx="120" cy="192" r="12" fill="#4da043"/></g>
            <!-- 管理室 -->
            <g id="guard" style="transition:opacity .4s"><rect x="150" y="192" width="26" height="20" fill="#fff" stroke="#c5cdd6"/><rect x="146" y="188" width="34" height="5" fill="#e4572e"/><rect x="160" y="200" width="7" height="12" fill="#8a8178"/></g>
            <!-- 建物 -->
            <g id="bld" transform="translate(190,210)">
              <rect id="body" x="0" y="-100" width="100" height="100" fill="#e9eef3" stroke="#c5cdd6"/>
              <g id="floors"></g>
              <rect id="roof" x="-4" y="-104" width="108" height="6" fill="#7b4fa3"/>
              <g id="cracks" class="crack" opacity="0" stroke="#8a8178" stroke-width="1.5" fill="none"><path d="M10 -20 l8 -14 l-5 -10 l9 -12"/><path d="M80 -60 l-6 -12 l7 -9"/><path d="M40 -8 l5 -11 l-4 -9"/></g>
              <g id="hilite" class="pulse" opacity="0"><rect x="0" y="-100" width="100" height="100" fill="none" stroke="#f2c14e" stroke-width="4"/></g>
            </g>
            <text id="caption" x="260" y="24" text-anchor="middle" font-size="12" fill="#4a443c" font-family="Noto Sans TC">你設定的房子</text>
          </svg>
        </div>
        <span class="kicker">試算結果</span>
        <div class="big" id="simPrice">—<small> 萬/坪</small></div>
        <div style="font-size:.84rem;color:var(--ink-3)" id="simBase">基準：—</div>
        <div class="sim-meter"><i id="simNeedle" style="left:50%"></i></div>
        <div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--ink-3);font-family:var(--mono);margin-top:4px"><span>−20%</span><span>0</span><span>+20%</span></div>
        <div class="adj" id="simAdj"></div>
        <div class="formula" id="simFormula"></div>
        <p class="disclaimer">調整率為教學示意，並非任何估價報告採用的數值。實務上調整率依個案、比較標的與估價目的而定，且須符合不動產估價技術規則；本頁不構成估價意見或投資建議。</p>
      </div>
    </div>

    <div class="section-head reveal" style="margin-top:56px"><div><h2>這一層的觀測項目</h2><p>估價師量這塊地時會看的八件事。</p></div></div>
    <div class="intl-grid" id="items"></div>
  </div>
</section>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
(function(){
  const D = window.DATA, VI = window.VI, $ = VI.$, $$ = VI.$$, toPing = VI.toPing;
  const simState = {};
  const sel = $("#simDistrict");
  [...D.market.districts].sort((a,b)=>b.p-a.p).forEach(d => { const o = document.createElement("option"); o.value = d.d; o.textContent = `${d.d}（${toPing(d.p)} 萬/坪）`; sel.appendChild(o); });
  sel.value = "中山區"; sel.onchange = calc;
  const wrap = $("#simControls");
  D.simFactors.forEach(f => {
    simState[f.id] = f.def;
    const el = document.createElement("div"); el.className = "ctrl";
    el.innerHTML = `<label>${f.name}<small>${f.hint}</small></label><div class="opts">${f.opts.map((o,i) => `<button data-f="${f.id}" data-i="${i}" class="${i===f.def?"on":""}">${o[0]}<b>${o[1]>0?"+":""}${o[1]}%</b></button>`).join("")}</div>`;
    wrap.appendChild(el);
  });
  $$("#simControls .opts button").forEach(b => b.onclick = () => { simState[b.dataset.f] = +b.dataset.i; $$(`#simControls button[data-f="${b.dataset.f}"]`).forEach(x => x.classList.remove("on")); b.classList.add("on"); calc(); flash(); });

  /* 房子插圖跟著條件變 */
  function flash(){ const h = $("#hilite"); h.setAttribute("opacity", 1); setTimeout(() => h.setAttribute("opacity", 0), 900); }
  function drawHouse(){
    const age = simState.age, floor = simState.floor, mrt = simState.mrt, road = simState.road, nimby = simState.nimby, layout = simState.layout, mgmt = simState.mgmt;
    // 樓層數：低 4 / 中 7 / 高 12 / 頂樓 12
    const n = [4, 7, 12, 12][floor]; const fh = Math.min(16, 140 / n); const H = n * fh;
    $("#body").setAttribute("y", -H); $("#body").setAttribute("height", H);
    $("#roof").setAttribute("y", -H - 4);
    const wall = ["#f3f6f9", "#e9eef3", "#ddd6c6", "#c9bda4"][age]; $("#body").setAttribute("fill", wall);
    const floors = $("#floors"); let s = "";
    const you = [0, Math.floor(n/2), n - 2, n - 1][floor];
    for (let i = 0; i < n; i++) {
      const y = -(i + 1) * fh + 3;
      const lit = i === you;
      for (let w = 0; w < 4; w++) s += `<rect class="fl" x="${10 + w * 22}" y="${y}" width="14" height="${fh - 6}" fill="${lit ? "#f2c14e" : layout === 0 ? "#bfe3f5" : layout === 1 ? "#9fc4d8" : "#6b7f8a"}" opacity="${lit ? 1 : .9}"/>`;
      if (lit) s += `<text x="-6" y="${y + fh/2}" text-anchor="end" font-size="10" fill="#e4572e" font-family="IBM Plex Mono">你 ${i+1}F</text>`;
    }
    floors.innerHTML = s;
    $("#cracks").setAttribute("opacity", age === 3 ? 1 : age === 2 ? .4 : 0);
    $("#pylon").style.opacity = nimby ? 1 : 0;
    $("#guard").style.opacity = mgmt === 0 ? 1 : 0;
    const rw = [12, 22, 34][road]; $("#road").setAttribute("y", 244 - rw); $("#road").setAttribute("height", rw); $("#roadline").setAttribute("y1", 244 - rw/2); $("#roadline").setAttribute("y2", 244 - rw/2);
    const mx = [300, 380, 470][mrt]; $("#mrt").setAttribute("transform", `translate(${mx - 300},0)`);
    $("#train").style.display = mrt === 2 ? "none" : "";
    $("#sun").style.opacity = [1, .6, .25][layout];
    $("#caption").textContent = `${D.simFactors[0].opts[age][0]}・${D.simFactors[1].opts[floor][0]}・捷運 ${D.simFactors[2].opts[mrt][0]}`;
  }
  function calc(){
    const d = D.market.districts.find(x => x.d === sel.value);
    const base = toPing(d.p);
    let mult = 1; const rows = [], parts = [];
    D.simFactors.forEach(f => { const o = f.opts[simState[f.id]]; mult *= (1 + o[1]/100); rows.push([f.name, o[0], o[1]]); parts.push(`(1${o[1]>=0?"+":"−"}${Math.abs(o[1])/100})`); });
    const price = Math.round(base * mult * 10) / 10, pct = (mult - 1) * 100;
    $("#simPrice").innerHTML = `${price}<small> 萬/坪</small>`;
    $("#simBase").textContent = `基準：${d.d} 近一年住宅大樓平均 ${base} 萬/坪（${d.n} 件）`;
    $("#simNeedle").style.left = `${Math.max(0, Math.min(100, 50 + pct * 2.5))}%`;
    $("#simAdj").innerHTML = rows.map(([n,o,v]) => `<div><span>${n}：${o}</span><b class="${v>0?"plus":v<0?"minus":""}">${v>0?"+":""}${v}%</b></div>`).join("") + `<div style="border-bottom:0;font-weight:700"><span>合計調整</span><b class="${pct>0?"plus":pct<0?"minus":""}">${pct>0?"+":""}${pct.toFixed(1)}%</b></div>`;
    $("#simFormula").textContent = `試算單價 = 基準 ${base} × ${parts.join(" × ")} = ${price} 萬/坪`;
    drawHouse();
  }
  calc();

  const L = D.layers.find(l => l.id === "ind");
  $("#items").innerHTML = L.items.map(i => `<div class="card intl-card reveal"><span class="from">INDIVIDUAL FACTORS</span><h3>${i.t}</h3><p>${i.s}</p><div class="path"><span>${i.i}</span></div></div>`).join("");
  VI.reveal();
})();
</script>
</body>
</html>
